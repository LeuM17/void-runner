workflows:
  android-release:
    name: VOID RUNNER - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - keystore_reference  # Leave this — Codemagic handles it
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - marianleu17@gmail.com
        notify:
          success: true
          failure: true
